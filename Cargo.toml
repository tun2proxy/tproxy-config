[package]
name = "tproxy-config"
version = "7.0.10"
edition = "2024"
description = "Transparent proxy configuration"
license = "MIT"
authors = ["@ssrlive"]
repository = "https://github.com/ssrlive/tproxy-config"
keywords = ["tun", "network", "tunnel", "transparent", "proxy"]
readme = "readme.md"

[features]
unsafe-state-file = ["dep:serde_json"]

# default = ["unsafe-state-file"]

[dependencies]
cidr = { version = "0.3.2", features = ["serde"] }
futures = "0.3.34"
libloading = "0.9.1"
log = { version = "0.4.35" }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.32.0", features = ["fs", "mount", "process"] }
rtnetlink = { git = "https://github.com/ssrlive/netlink-ng", rev = "1c923b2" }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
serde_json = { version = "1.0.154", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Rpc",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_Security_WinTrust",
] }
